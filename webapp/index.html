<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Прыг-Куб</title>
  <!-- SDK Telegram Mini Apps: даёт Telegram.WebApp (expand, хаптика, цвета шапки). Вне Telegram просто ничего не делает. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --bg: #2a48b5; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--bg); color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
    #overlay {
      position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
      background: rgba(8, 10, 30, .45); transition: opacity .18s ease;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    .card { max-width: 340px; text-align: center; }
    .logo {
      width: 56px; height: 56px; margin: 0 auto 14px; position: relative;
      background: #ffd23f; border: 4px solid #151515; border-radius: 6px;
      transform: rotate(-8deg); box-shadow: 0 6px 0 rgba(0, 0, 0, .25);
    }
    .logo::before, .logo::after { content: ""; position: absolute; top: 13px; width: 7px; height: 12px; background: #151515; }
    .logo::before { right: 8px; }
    .logo::after { right: 20px; }
    h1 { margin: 0 0 8px; font-size: 40px; line-height: 1.05; text-shadow: 0 3px 0 rgba(0, 0, 0, .3); }
    p { margin: 0 0 20px; font-size: 15px; line-height: 1.4; opacity: .92; }
    button {
      font: inherit; font-size: 18px; font-weight: 700; color: #151515;
      background: #5cff6a; border: 0; border-radius: 14px; padding: 14px 40px;
      box-shadow: 0 5px 0 #1f9e2c; cursor: pointer;
    }
    button:active { transform: translateY(3px); box-shadow: 0 2px 0 #1f9e2c; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="overlay">
    <div class="card">
      <div class="logo"></div>
      <h1 id="ov-title">Прыг-Куб</h1>
      <p id="ov-text"></p>
      <button id="ov-btn" type="button">Играть</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
